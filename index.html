<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BizOne ERP</title>
    <meta
      name="description"
      content="BizOne ERP - Hệ thống quản trị bán lẻ, bán buôn, thương mại điện tử và F&B"
    />
    <meta name="theme-color" content="#2563EB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BizOne" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-[#F8FAFC] text-slate-800 font-['Plus_Jakarta_Sans',sans-serif] antialiased">
    <div id="root"></div>
    <script type="text/javascript">
      // GitHub Pages SPA redirect query parser
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script>
      // Production API bridge: GitHub Pages cannot serve POST /api/*.
      // Route all relative /api/* requests to the Render backend before the app loads.
      (function () {
        var API_BASE = 'https://api.wiup.vn';
        var nativeFetch = window.fetch.bind(window);

        window.fetch = function (input, init) {
          var url = input instanceof Request ? input.url : String(input);
          var nextInput = input;

          if (url.indexOf('/api/') === 0) {
            nextInput = API_BASE + url;
          } else if (url.indexOf(window.location.origin + '/api/') === 0) {
            var parsed = new URL(url);
            nextInput = API_BASE + parsed.pathname + parsed.search;
          }

          return nativeFetch(nextInput, init);
        };
      })();
    </script>
    <script src="/registration-otp-bridge.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
